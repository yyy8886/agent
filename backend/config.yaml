app:
  active_model: deepseek_chat        # 当前使用的模型，切换改这里即可

# Skill 快捷命令。当前命令行版本使用 /命令；Electron 阶段再映射为真实按键。
skill_shortcuts:
  drawio-skill:
    trigger: /drawio
    route: diagram_artist
    default_input: 请说明你想绘制的图和步骤。
    enabled: true
  skill-manager:
    trigger: /skills
    route: skill_manager
    default_input: 列出技能
    enabled: true

# 每个 Agent 的 Skill 权限。defaults 默认全关；列表中出现才允许使用。
# 任意 Agent 都可以配置任意 Skill，但建议初始只开放职业所需能力。
agent_skills:
  defaults: []
  agents:
    mabel:
      - conversation
    analyst:
      - task-routing
    python_teacher:
      - python-teaching
    time_announcer:
      - current-time
    librarian:
      - knowledge-retrieval
    diagram_artist:
      - drawio-skill
    skill_manager:
      - skill-management
    identity_manager:
      - identity-management
    general:
      - general-answer
    validator:
      - answer-validation

models:
  openai_proxy:                    # API 中转站 — GPT-5.5 走代理
    provider: openai
    model: gpt-5.5
    base_url: https://sapi.nyro.lol/v1
    temperature: 0.2
    timeout_seconds: 60
    max_retries: 2

  deepseek_chat:                   # DeepSeek V3（通用对话）
    provider: deepseek
    model: deepseek-chat
    temperature: 0.2
    timeout_seconds: 60
    max_retries: 2

  openai_gpt:                      # OpenAI 直连
    provider: openai
    model: gpt-5.6-sol
    temperature: 0.2
    timeout_seconds: 60
    max_retries: 2

  ollama_local:                    # 本地 Ollama
    provider: ollama
    model: qwen3:8b
    base_url: http://127.0.0.1:11434
    temperature: 0.2
