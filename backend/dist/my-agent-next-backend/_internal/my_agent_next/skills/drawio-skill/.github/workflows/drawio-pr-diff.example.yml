# Template workflow for automated PR diagram review.
#
# This file ships as `.example.yml` and is gated with `if: false` so it does
# NOTHING until you copy it into your own repo and adapt it:
#
#   1. Copy `.github/actions/drawio-diff/` and `skills/drawio-skill/` into
#      your repo (or at least `scripts/prdiff.py`, `scripts/drawiodiff.py`,
#      `scripts/autolayout.py`).
#   2. Copy this file to `.github/workflows/drawio-pr-diff.yml`.
#   3. Remove the `if: false` guard and uncomment the `pull_request` trigger.
#   4. Push a PR that touches a `.drawio` file and watch it run.
#
# The job needs `pull-requests: write` for the sticky comment step.

name: Draw.io PR Diff

on:
  # Uncomment to enable:
  # pull_request:
  #   paths: ["**/*.drawio"]

jobs:
  drawio-diff:
    runs-on: ubuntu-latest
    if: false  # disabled by default — remove this line to enable
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Draw.io PR Diff
        uses: ./.github/actions/drawio-diff
        with:
          out-dir: drawio-pr
          # skip-tool-install: "true"  # set if drawio + dot already on PATH
