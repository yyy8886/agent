<!--
index.html — My Agent Next 管理中心
=============================================================================
管理 API 配置（Profile）和 Agent 配置，纯静态单页面（SPA）。

功能标签页：
  1. API 配置 — 管理模型连接（provider / model / Key），含测速
  2. Agent 管理 — 管理 Agent（角色设定 / 绑定模型 / 分配 Skill）

与后端的关系：
  浏览器 → web_server.py (FastAPI)
  /api/profiles/*  → API 配置 CRUD + 测速
  /api/agents/*    → Agent CRUD
  /api/skills      → 可用 Skill 列表
  /api/model-options → 可选模型列表
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Agent Next — 管理中心</title>
<style>
  :root {
    --bg: #0f1117;
    --card-bg: #1a1d27;
    --border: #2a2d3a;
    --text: #e1e4eb;
    --text-dim: #8b8fa3;
    --accent: #6c8cff;
    --accent-hover: #8ba3ff;
    --danger: #f44771;
    --success: #34d399;
    --warning: #fbbf24;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  .container { max-width: 1100px; margin: 0 auto; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
  }
  h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; margin-bottom: 28px; border-bottom: 2px solid var(--border); }
  .tab {
    padding: 10px 24px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    border: none; background: none; color: var(--text-dim);
    border-bottom: 2px solid transparent; margin-bottom: -2px;
    transition: color .15s, border-color .15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover { color: var(--text); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; border-radius: var(--radius-sm); border: none;
    cursor: pointer; font-size: 0.875rem; font-weight: 600;
    transition: background .15s, opacity .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-sm { padding: 4px 12px; font-size: 0.8rem; }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--border); }

  /* Cards */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    transition: border-color .15s;
  }
  .card:hover { border-color: #3a3e50; }
  .card.default { border-color: var(--accent); }
  .card.disabled { opacity: 0.55; }

  .card-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 14px;
  }
  .card-title { font-size: 1.05rem; font-weight: 700; }
  .card-id { font-size: 0.75rem; color: var(--text-dim); font-family: monospace; margin-top: 2px; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .badge-default { background: var(--accent); color: #fff; }
  .badge-disabled { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }

  .card-body { font-size: 0.85rem; line-height: 1.7; color: var(--text-dim); }
  .card-body span { font-weight: 600; color: var(--text); }
  .field-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .field-row > div { flex: 1; min-width: 80px; }

  .card-actions { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }

  /* Agent card extras */
  .persona-preview {
    margin-top: 8px; padding: 8px 12px; background: #11131c; border-radius: var(--radius-sm);
    font-size: 0.8rem; color: var(--text-dim); line-height: 1.5;
    max-height: 80px; overflow: hidden; position: relative;
  }
  .persona-preview::after {
    content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 24px;
    background: linear-gradient(transparent, #11131c);
  }
  .skill-tag {
    display: inline-block; padding: 1px 8px; margin: 2px 4px 2px 0;
    border-radius: 999px; font-size: 0.7rem; font-weight: 600;
    background: rgba(108,140,255,.15); color: var(--accent);
  }
  .skill-tag-empty { color: var(--text-dim); font-size: 0.78rem; }

  /* Speed test */
  .speed-result {
    margin-top: 12px; padding: 10px 14px; border-radius: var(--radius-sm);
    font-size: 0.83rem; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .speed-success { background: rgba(52,211,153,.12); color: var(--success); }
  .speed-fail { background: rgba(244,71,113,.12); color: var(--danger); }
  .speed-running { background: rgba(251,191,36,.12); color: var(--warning); }
  .speed-dot { width: 8px; height: 8px; border-radius: 50%; }
  .speed-success .speed-dot { background: var(--success); }
  .speed-fail .speed-dot { background: var(--danger); }
  .speed-running .speed-dot { background: var(--warning); animation: pulse .8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 28px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { font-size: 1.2rem; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 0.8rem; font-weight: 600;
    color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 8px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: #11131c; color: var(--text);
    font-size: 0.9rem; font-family: inherit;
  }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  .form-check {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    font-size: 0.85rem; cursor: pointer;
  }
  .form-check input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* Skill checkboxes grid */
  .skill-checkboxes {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 4px; max-height: 200px; overflow-y: auto;
    padding: 8px; background: #11131c; border: 1px solid var(--border); border-radius: var(--radius-sm);
  }

  /* Toast */
  .toast {
    position: fixed; top: 20px; right: 20px; z-index: 200;
    padding: 12px 20px; border-radius: var(--radius-sm);
    font-size: 0.85rem; font-weight: 600;
    animation: slideIn .2s ease;
  }
  .toast-error { background: var(--danger); color: #fff; }
  .toast-success { background: var(--success); color: #000; }
  @keyframes slideIn { from { transform: translateX(60px); opacity: 0 } to { transform: none; opacity: 1 } }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }

  /* ═══════════════════════════════════════════════════════════════════════
     Workspace layout
     ═══════════════════════════════════════════════════════════════════════ */
  .workspace { display: flex; height: calc(100vh - 140px); gap: 0; min-height: 500px; }
  .ws-sidebar {
    width: 280px; min-width: 220px;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ws-sidebar-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .ws-sidebar-section label { font-size: 0.7rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .ws-sidebar-section select { width: 100%; margin-top: 4px; padding: 6px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #11131c; color: var(--text); font-size: 0.85rem; }

  .ws-thread-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .ws-thread-item {
    padding: 10px 14px; cursor: pointer; transition: background .1s;
    border-bottom: 1px solid rgba(42,45,58,.4);
  }
  .ws-thread-item:hover { background: rgba(255,255,255,.03); }
  .ws-thread-item.active { background: rgba(108,140,255,.1); border-left: 2px solid var(--accent); padding-left: 12px; }
  .ws-thread-item .t-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-thread-item .t-meta { font-size: 0.7rem; color: var(--text-dim); display: flex; gap: 8px; justify-content: space-between; }
  .ws-thread-item .t-delete { opacity: 0; font-size: 0.75rem; color: var(--danger); cursor: pointer; transition: opacity .1s; }
  .ws-thread-item:hover .t-delete { opacity: 0.7; }

  .ws-chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .ws-messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .ws-msg { margin-bottom: 16px; display: flex; flex-direction: column; }
  .ws-msg-label { font-size: 0.7rem; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .ws-msg.user .ws-msg-label { color: var(--accent); align-self: flex-end; }
  .ws-msg.assistant .ws-msg-label { color: var(--success); }
  .ws-msg-bubble {
    max-width: 80%; padding: 10px 16px; border-radius: var(--radius-sm);
    font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  .ws-msg.user .ws-msg-bubble { background: rgba(108,140,255,.15); align-self: flex-end; }
  .ws-msg.assistant .ws-msg-bubble { background: #11131c; border: 1px solid var(--border); }

  .ws-input-area {
    padding: 12px 16px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: flex-end;
  }
  .ws-input-area textarea {
    flex: 1; padding: 10px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: #11131c; color: var(--text);
    font-size: 0.9rem; font-family: inherit; resize: none; min-height: 42px; max-height: 120px;
  }
  .ws-input-area textarea:focus { outline: none; border-color: var(--accent); }

  .ws-placeholder {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-dim); text-align: center; padding: 40px;
  }
  .ws-placeholder h3 { font-size: 1.1rem; color: var(--text); margin-bottom: 8px; }
  .ws-empty-threads { padding: 20px 14px; text-align: center; color: var(--text-dim); font-size: 0.8rem; }

  .ws-wf-section { padding: 12px 14px; border-top: 1px solid var(--border); }
  .ws-wf-section .wf-title { font-size: 0.7rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .ws-wf-placeholder { padding: 16px; text-align: center; color: var(--text-dim); font-size: 0.78rem; border: 1px dashed var(--border); border-radius: var(--radius-sm); }

  /* Responsive workspace */
  @media (max-width: 700px) {
    .workspace { flex-direction: column; height: auto; }
    .ws-sidebar { width: 100%; min-width: auto; border-right: none; border-bottom: 1px solid var(--border); max-height: 200px; overflow-y: auto; }
  }
  .empty-state h3 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }

  /* Permission toggle */
  .perm-btn {
    padding: 3px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim); font-size: .72rem;
    font-weight: 700; cursor: pointer; transition: all .15s;
  }
  .perm-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .perm-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  /* Tool call bubble in chat */
  .tool-call-msg {
    margin: 4px 0; padding: 6px 12px; border-radius: var(--radius-sm);
    font-size: .75rem; font-family: monospace; background: rgba(251,191,36,.08);
    border: 1px solid rgba(251,191,36,.2); color: var(--warning);
    display: flex; align-items: center; gap: 6px;
  }
  .tool-call-msg.confirming { background: rgba(244,71,113,.08); border-color: rgba(244,71,113,.2); color: var(--danger); }

  /* Thinking indicator */
  .thinking-msg {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: .8rem; color: var(--text-dim); padding: 2px 0;
  }
  .thinking-spinner {
    width: 12px; height: 12px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tool log — collapsible list of tools/skills the agent called */
  .tool-log {
    margin: 4px 0; border: 1px solid var(--border);
    border-radius: var(--radius-sm); overflow: hidden;
  }
  .tool-log-header {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; cursor: pointer; user-select: none;
    font-size: .75rem; color: var(--text-dim);
    background: rgba(255,255,255,.02);
  }
  .tool-log-header:hover { color: var(--text); }
  .tool-log-header .arrow { display: inline-block; transition: transform .15s; }
  .tool-log.open .tool-log-header .arrow { transform: rotate(90deg); }
  .tool-log-body {
    display: none; padding: 6px 10px; border-top: 1px solid var(--border);
    font-size: .72rem; font-family: monospace; line-height: 1.6;
    max-height: 200px; overflow-y: auto;
  }
  .tool-log.open .tool-log-body { display: block; }
  .tool-log-item { display: flex; gap: 6px; margin: 2px 0; color: var(--text-dim); }
  .tool-log-item .tl-name { color: var(--warning); flex-shrink: 0; font-weight: 600; }
  .tool-log-item .tl-skill { color: var(--accent); flex-shrink: 0; }
  .tool-log-item .tl-detail { color: var(--text-dim); word-break: break-all; min-width: 0; }
  .skill-compat { display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700; }
  .skill-compat::before { content:"";width:8px;height:8px;border-radius:50%;background:#778; }
  .skill-compat.green::before { background:var(--success); }
  .skill-compat.yellow::before { background:var(--warning); }
  .skill-compat.red::before { background:var(--danger); }
  .skill-card-tools { display:flex;align-items:center;gap:8px;margin-left:auto; }
  .skill-icon-btn { border:0;background:transparent;color:var(--text-dim);cursor:pointer;font-size:1rem;padding:3px 5px; }
  .skill-icon-btn:hover { color:var(--accent); }
  .skill-description.collapsed { display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
  .skill-details { display:none;border-top:1px solid var(--border);margin-top:10px;padding-top:10px;font-size:.76rem;line-height:1.55;color:var(--text-dim); }
  .skill-card.expanded .skill-details { display:block; }
  .skill-card.expanded .skill-description { display:block; }
  .compat-issue { margin-top:6px;padding:6px 8px;border-radius:6px;background:rgba(255,255,255,.025); }

  @media (max-width: 500px) {
    body { padding: 14px; }
    .cards-grid { grid-template-columns: 1fr; }
    .form-row { flex-direction: column; gap: 0; }
    header { flex-direction: column; align-items: flex-start; }
    .skill-checkboxes { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>⚡ My Agent Next</h1>
      <p style="color:var(--text-dim);font-size:.85rem;margin-top:4px">API Profile 管理 &amp; Agent 配置</p>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" id="btnNewProfile" onclick="openAddModal()">+ 新建 API 配置</button>
      <button class="btn btn-primary" id="btnNewAgent" onclick="openAgentAddModal()" style="display:none">+ 新建 Agent</button>
      <button class="btn btn-primary" id="btnNewThread" onclick="workspaceNewThread()" style="display:none">+ 新建对话</button>
    </div>
  </header>

  <!-- ── 标签页 ─────────────────────────────────────────────────────────────── -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('profiles')">🔌 API 配置</button>
    <button class="tab" onclick="switchTab('agents')">🤖 Agent 管理</button>
    <button class="tab" onclick="switchTab('workspace')">💬 工作台</button>
    <button class="tab" onclick="switchTab('marketplace')">🛒 Skill 市场</button>
  </div>

  <!-- ── API 配置页 ─────────────────────────────────────────────────────────── -->
  <div id="tab-profiles" class="tab-content active">
    <div id="profiles" class="cards-grid"></div>
    <div id="empty-profiles" class="empty-state hidden">
      <h3>还没有 API 配置</h3><p>点击「新建 API 配置」添加模型连接。</p>
    </div>
  </div>

  <!-- ── Agent 管理页 ───────────────────────────────────────────────────────── -->
  <div id="tab-agents" class="tab-content">
    <div id="agents" class="cards-grid"></div>
    <div id="empty-agents" class="empty-state hidden">
      <h3>还没有 Agent</h3><p>点击「新建 Agent」创建第一个智能体。</p>
    </div>
  </div>

  <!-- ── Skill 市场 ──────────────────────────────────────────────────────────── -->
  <div id="tab-marketplace" class="tab-content">
    <div style="display:flex;gap:12px;margin-bottom:16px;align-items:center">
      <input id="mpSearch" placeholder="搜索 Skill..." style="flex:1;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:#11131c;color:var(--text);font-size:.9rem"
        onkeydown="if(event.key==='Enter') mpSearch()">
      <select id="mpSource" style="padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:#11131c;color:var(--text);font-size:.85rem">
        <option value="all">全部来源</option><option value="clawhub">ClawHub</option><option value="skillsmp">SkillsMP</option>
      </select>
      <select id="mpSort" style="padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:#11131c;color:var(--text);font-size:.85rem">
        <option value="trending">最热</option><option value="relevance">关联度最高</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="mpSearch()">搜索</button>
    </div>
    <div id="mpInstalled" style="margin-bottom:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <h3 style="font-size:.9rem;font-weight:700;color:var(--text)">📦 已安装 (<span id="mpInstalledCount">0</span>)</h3>
      </div>
      <div id="mpInstalledList" class="cards-grid"></div>
      <div id="mpInstalledEmpty" style="padding:12px;text-align:center;color:var(--text-dim);font-size:.8rem;border:1px dashed var(--border);border-radius:var(--radius-sm)">暂无已安装 Skill</div>
    </div>
    <div id="mpResults" class="cards-grid"></div>
    <div id="mpEmpty" class="empty-state hidden"><h3>搜索 Skill 市场</h3><p>输入关键词搜索 ClawHub 和 SkillsMP 上的 Skill。</p></div>
  </div>

  <!-- ── 工具确认弹窗 ────────────────────────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="modalToolConfirm">
    <div class="modal" style="max-width:460px">
      <h2 id="toolConfirmTitle">工具调用确认</h2>
      <div id="toolConfirmBody" style="margin-bottom:16px;font-size:.85rem;line-height:1.6"></div>
      <div class="form-actions">
        <button class="btn btn-danger btn-sm" onclick="toolConfirmRespond(false)">拒绝</button>
        <button class="btn btn-primary btn-sm" onclick="toolConfirmRespond(true)">允许</button>
      </div>
    </div>
  </div>

  <!-- ── 用户问答弹窗 ────────────────────────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="modalAskUser">
    <div class="modal" style="max-width:520px">
      <h2 id="askUserTitle">需要您的输入</h2>
      <div id="askUserBody" style="margin-bottom:16px;font-size:.85rem;line-height:1.6"></div>
      <div class="form-actions">
        <button class="btn btn-danger btn-sm" onclick="askUserRespond(null)">跳过</button>
        <button class="btn btn-primary btn-sm" onclick="askUserRespond()">提交</button>
      </div>
    </div>
  </div>

  <!-- ── 工作台 ─────────────────────────────────────────────────────────────── -->
  <div id="tab-workspace" class="tab-content">
    <div class="workspace">
      <!-- 左侧栏 -->
      <div class="ws-sidebar">
        <div class="ws-sidebar-section" style="display:flex;align-items:center;gap:8px">
          <div style="flex:1">
            <label>选择 Agent</label>
            <select id="wsAgentSelect" onchange="workspaceOnAgentChange()"><option value="">-- 请选择 --</option></select>
          </div>
        </div>
        <div class="ws-sidebar-section" style="display:flex;align-items:center;gap:8px">
          <label style="font-size:.7rem;font-weight:700;color:var(--text-dim);text-transform:uppercase">权限模式</label>
          <div style="display:flex;gap:4px;margin-top:4px">
            <button class="perm-btn active" id="permManual" onclick="setPermissionMode('manual')">手动</button>
            <button class="perm-btn" id="permAuto" onclick="setPermissionMode('auto')">自动</button>
          </div>
        </div>
        <div class="ws-thread-list" id="wsThreadList">
          <div class="ws-empty-threads">请先选择 Agent</div>
        </div>
        <div class="ws-wf-section">
          <div class="wf-title">⚙ 工作流配置</div>
          <div class="ws-wf-placeholder">待实现</div>
        </div>
      </div>
      <!-- 对话区 -->
      <div class="ws-chat" id="wsChat">
        <div class="ws-placeholder" id="wsPlaceholder">
          <h3>💬 工作台</h3>
          <p>选择 Agent 后开始对话</p>
        </div>
        <div class="ws-messages" id="wsMessages" style="display:none"></div>
        <div class="ws-input-area" id="wsInputArea" style="display:none">
          <textarea id="wsInput" rows="1" placeholder="输入消息… (Enter 发送，Shift+Enter 换行)"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();workspaceSend()}"></textarea>
          <button class="btn btn-primary btn-sm" onclick="workspaceSend()">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     API Profile 编辑弹窗
     ═════════════════════════════════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="modalProfile">
  <div class="modal">
    <h2 id="profileModalTitle">新建 API 配置</h2>
    <form id="profileForm" onsubmit="submitProfileForm(event)">
      <input type="hidden" id="formIsEdit">
      <div class="form-group"><label>配置 ID（唯一标识）</label><input id="formId" required placeholder="例如 deepseek_chat" pattern="[a-z][a-z0-9_-]{1,50}"></div>
      <div class="form-group"><label>显示名称</label><input id="formName" required placeholder="例如 DeepSeek Chat"></div>
      <div class="form-row">
        <div class="form-group"><label>Provider</label><select id="formProvider" onchange="onProviderChange()"><option value="openai">OpenAI / 兼容代理</option><option value="deepseek">DeepSeek</option><option value="ollama">Ollama</option></select></div>
        <div class="form-group"><label>模型名称</label><input id="formModel" required placeholder="例如 deepseek-chat"></div>
      </div>
      <div class="form-group"><label>Base URL</label><input id="formBaseUrl" placeholder="留空使用 provider 默认地址"></div>
      <div class="form-group" id="apiKeyEnvGroup"><label>API Key 环境变量名</label><input id="formApiKeyEnv" placeholder="例如 DEEPSEEK_API_KEY" pattern="[A-Z][A-Z0-9_]*"></div>
      <div class="form-row">
        <div class="form-group"><label>Temperature</label><input id="formTemperature" type="number" value="0.2" step="0.1" min="0" max="2"></div>
        <div class="form-group"><label>Timeout（秒）</label><input id="formTimeout" type="number" value="60" min="1" max="600"></div>
        <div class="form-group"><label>Max Retries</label><input id="formMaxRetries" type="number" value="2" min="0" max="10"></div>
      </div>
      <div class="form-check"><input type="checkbox" id="formEnabled" checked><label for="formEnabled">启用</label></div>
      <div class="form-check"><input type="checkbox" id="formIsDefault"><label for="formIsDefault">设为默认</label></div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="closeProfileModal()">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     Agent 编辑弹窗
     ═══════════════════════════════════════════════════════════════════════════ -->
<div class="modal-overlay hidden" id="modalAgent">
  <div class="modal">
    <h2 id="agentModalTitle">新建 Agent</h2>
    <form id="agentForm" onsubmit="submitAgentForm(event)">
      <input type="hidden" id="agentFormIsEdit">
      <div class="form-group"><label>Agent ID（唯一标识）</label><input id="agentFormId" required placeholder="例如 mabel" pattern="[a-z][a-z0-9_-]{1,40}"></div>
      <div class="form-group"><label>显示名称</label><input id="agentFormName" required placeholder="例如 梅贝尔"></div>
      <div class="form-group"><label>角色描述</label><input id="agentFormRole" placeholder="例如 陪伴者与最终输出"></div>
      <div class="form-group"><label>绑定模型</label><select id="agentFormModel"></select>
      <div style="font-size:.75rem;color:var(--text-dim);margin-top:4px">留空则自动使用默认 API 配置</div></div>
      <div class="form-group"><label>Persona / 系统提示词</label><textarea id="agentFormPersona" placeholder="直接传给 LLM 的 system prompt，定义 Agent 的语气、风格和行为规则。"></textarea></div>
      <div class="form-group">
        <label>可用 Skill</label>
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <input id="skillInput" placeholder="输入 Skill 名称后回车添加" style="flex:1"
            onkeydown="if(event.key==='Enter'){event.preventDefault();addSkillTag()}">
          <button type="button" class="btn btn-ghost btn-sm" onclick="addSkillTag()">添加</button>
        </div>
        <div id="skillTags" style="display:flex;flex-wrap:wrap;gap:4px;min-height:28px"></div>
        <div id="skillSuggestions" style="margin-top:8px;font-size:.75rem;color:var(--text-dim)"></div>
      </div>
      <div class="form-check"><input type="checkbox" id="agentFormEnabled" checked><label for="agentFormEnabled">启用</label></div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="closeAgentModal()">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script>
// ═════════════════════════════════════════════════════════════════════════════
// 工具函数
// ═════════════════════════════════════════════════════════════════════════════
const $ = (s) => document.querySelector(s);
function esc(s) { return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ═════════════════════════════════════════════════════════════════════════════
// 标签页切换
// ═════════════════════════════════════════════════════════════════════════════
let currentTab = "profiles";
const TAB_INDEX = { profiles: 0, agents: 1, workspace: 2, marketplace: 3 };
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach((t,i) => t.classList.toggle("active", i === TAB_INDEX[tab]));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  document.getElementById("tab-"+tab).classList.add("active");
  document.getElementById("btnNewProfile").style.display = tab==="profiles"?"":"none";
  document.getElementById("btnNewAgent").style.display = tab==="agents"?"":"none";
  document.getElementById("btnNewThread").style.display = tab==="workspace"?"":"none";
  if (tab === "workspace") workspaceInit();
  if (tab === "marketplace") { loadInstalledSkills(); if (!mpHasSearched) mpSearch(""); }
}
window.switchTab = switchTab;

// ═════════════════════════════════════════════════════════════════════════════
// Toast
// ═════════════════════════════════════════════════════════════════════════════
function toast(msg, type) {
  const el = document.createElement("div");
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ═════════════════════════════════════════════════════════════════════════════
// ============== API Profile ==============
// ═════════════════════════════════════════════════════════════════════════════
let profiles = [];

async function loadProfiles() {
  try {
    const res = await fetch("/api/profiles");
    if (!res.ok) throw new Error(await res.text());
    profiles = await res.json();
    renderProfiles();
  } catch(e) { toast("加载 API 配置失败: "+e.message, "error"); }
}
window.loadProfiles = loadProfiles;

function renderProfiles() {
  const grid = $("#profiles"), empty = $("#empty-profiles");
  if (!profiles.length) { grid.innerHTML=""; empty.classList.remove("hidden"); return; }
  empty.classList.add("hidden");
  grid.innerHTML = profiles.map(p => profileCard(p)).join("");
}

function profileCard(p) {
  const db = p.is_default ? '<span class="badge badge-default">默认</span>' : "";
  const dd = !p.enabled ? '<span class="badge badge-disabled">已停用</span>' : "";
  const ks = p.provider==="ollama"?'<span style="color:var(--success)">无需 Key</span>':
    (p.api_key_configured?'<span style="color:var(--success)">Key 已配置</span>':'<span style="color:var(--warning)">Key 未配置</span>');
  const env = p.provider!=="ollama"?`<div><span>环境变量：</span>${esc(p.api_key_env||"未设置")}</div>`:"";
  return `<div class="card${p.is_default?" default":""}${!p.enabled?" disabled":""}">
    <div class="card-header"><div><div class="card-title">${esc(p.name)}${db}${dd}</div><div class="card-id">${esc(p.id)}</div></div></div>
    <div class="card-body">
      <div class="field-row"><div><span>Provider：</span>${esc(p.provider)}</div><div><span>Model：</span>${esc(p.model)}</div></div>
      ${p.base_url?`<div style="margin-top:4px"><span>URL：</span><code style="font-size:.78rem">${esc(p.base_url)}</code></div>`:""}
      ${env}
      <div class="field-row" style="margin-top:8px"><div><span>Temp：</span>${p.temperature}</div><div><span>Timeout：</span>${p.timeout_seconds}s</div><div><span>Retry：</span>${p.max_retries}</div></div>
      <div style="margin-top:6px">${ks}</div>
    </div>
    <div class="card-actions">
      <button class="btn btn-ghost btn-sm" onclick="speedTest('${p.id}')">⚡ 测速</button>
      ${!p.is_default?`<button class="btn btn-ghost btn-sm" onclick="setDefault('${p.id}')">⭐ 设默认</button>`:""}
      <button class="btn btn-ghost btn-sm" onclick="openEditModal('${p.id}')">✏️ 编辑</button>
      ${!p.is_default?`<button class="btn btn-danger btn-sm" onclick="deleteProfile('${p.id}')">🗑 删除</button>`:""}
    </div>
    <div id="speed-${p.id}"></div>
  </div>`;
}

// Profile modal
function openAddModal() {
  $("#profileModalTitle").textContent="新建 API 配置"; $("#formIsEdit").value=""; $("#formId").disabled=false;
  $("#formId").value=""; $("#formName").value=""; $("#formProvider").value="openai"; $("#formModel").value="";
  $("#formBaseUrl").value=""; $("#formApiKeyEnv").value=""; $("#formTemperature").value="0.2";
  $("#formTimeout").value="60"; $("#formMaxRetries").value="2"; $("#formEnabled").checked=true; $("#formIsDefault").checked=false;
  onProviderChange(); $("#modalProfile").classList.remove("hidden");
}
window.openAddModal = openAddModal;

function openEditModal(id) {
  const p = profiles.find(x=>x.id===id); if(!p) return;
  $("#profileModalTitle").textContent=`编辑 ${p.id}`; $("#formIsEdit").value=p.id; $("#formId").value=p.id; $("#formId").disabled=true;
  $("#formName").value=p.name; $("#formProvider").value=p.provider; $("#formModel").value=p.model;
  $("#formBaseUrl").value=p.base_url||""; $("#formApiKeyEnv").value=p.api_key_env||"";
  $("#formTemperature").value=p.temperature; $("#formTimeout").value=p.timeout_seconds;
  $("#formMaxRetries").value=p.max_retries; $("#formEnabled").checked=p.enabled; $("#formIsDefault").checked=p.is_default;
  onProviderChange(); $("#modalProfile").classList.remove("hidden");
}
window.openEditModal = openEditModal;

function closeProfileModal() { $("#modalProfile").classList.add("hidden"); }
window.closeProfileModal = closeProfileModal;

function onProviderChange() {
  const g = $("#apiKeyEnvGroup"), pv = $("#formProvider").value;
  g.style.display = pv==="ollama"?"none":"block";
  if(pv==="ollama") $("#formApiKeyEnv").removeAttribute("required");
  else $("#formApiKeyEnv").setAttribute("required","");
}
window.onProviderChange = onProviderChange;

async function submitProfileForm(e) {
  e.preventDefault();
  const p = {
    id:$("#formId").value.trim(), name:$("#formName").value.trim(), provider:$("#formProvider").value,
    model:$("#formModel").value.trim(), base_url:$("#formBaseUrl").value.trim(),
    temperature:parseFloat($("#formTemperature").value)||0.2, timeout_seconds:parseInt($("#formTimeout").value)||60,
    max_retries:parseInt($("#formMaxRetries").value)||2, enabled:$("#formEnabled").checked, is_default:$("#formIsDefault").checked,
  };
  if($("#formProvider").value!=="ollama") p.api_key_env=$("#formApiKeyEnv").value.trim();
  try {
    const r = await fetch("/api/profiles",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
    if(!r.ok){const e=await r.json();throw new Error(e.detail);}
    closeProfileModal(); await loadProfiles(); toast(`已保存 ${p.id}`,"success");
  } catch(e){toast(e.message,"error");}
}
window.submitProfileForm = submitProfileForm;

async function deleteProfile(id) {
  if(!confirm(`确定删除 "${id}"？`)) return;
  try {
    const r = await fetch(`/api/profiles/${id}`,{method:"DELETE"});
    if(!r.ok){const e=await r.json();throw new Error(e.detail);}
    await loadProfiles(); toast(`已删除 ${id}`,"success");
  } catch(e){toast(e.message,"error");}
}
window.deleteProfile = deleteProfile;

async function setDefault(id) {
  try {
    await fetch(`/api/profiles/${id}/set-default`,{method:"POST"});
    await loadProfiles(); toast(`已将 ${id} 设为默认`,"success");
  } catch(e){toast("操作失败","error");}
}
window.setDefault = setDefault;

async function speedTest(id) {
  const el = $(`#speed-${id}`); el.innerHTML = '<div class="speed-result speed-running"><span class="speed-dot"></span>测速中…</div>';
  try {
    const r = await fetch(`/api/profiles/${id}/speed-test`,{method:"POST"}); const d = await r.json();
    if(d.success) el.innerHTML=`<div class="speed-result speed-success"><span class="speed-dot"></span>✔ ${d.latency_ms}ms — ${esc(d.response_preview||"")}</div>`;
    else el.innerHTML=`<div class="speed-result speed-fail"><span class="speed-dot"></span>✘ 失败 (${d.latency_ms}ms)：${esc(d.error||"未知错误")}</div>`;
  } catch(e){ el.innerHTML=`<div class="speed-result speed-fail"><span class="speed-dot"></span>✘ ${esc(e.message)}</div>`; }
}
window.speedTest = speedTest;

$("#modalProfile").addEventListener("click", e => { if(e.target===$("#modalProfile")) closeProfileModal(); });

// ═════════════════════════════════════════════════════════════════════════════
// ============== Agent ==============
// ═════════════════════════════════════════════════════════════════════════════
let agents = [];
let allSkills = [];
let modelOptions = [];

async function loadAgents() {
  try {
    const [aRes, sRes, mRes] = await Promise.all([
      fetch("/api/agents"), fetch("/api/skills"), fetch("/api/model-options")
    ]);
    if (!aRes.ok) throw new Error(await aRes.text());
    agents = await aRes.json();
    allSkills = await sRes.json();
    modelOptions = await mRes.json();
    renderAgents();
    populateSkillSuggestions();
    populateModelSelect();
  } catch(e) { toast("加载 Agent 失败: "+e.message, "error"); }
}
window.loadAgents = loadAgents;

function renderAgents() {
  const grid = $("#agents"), empty = $("#empty-agents");
  if (!agents.length) { grid.innerHTML=""; empty.classList.remove("hidden"); return; }
  empty.classList.add("hidden");
  grid.innerHTML = agents.map(a => agentCard(a)).join("");
}

function agentCard(a) {
  const dd = !a.enabled ? '<span class="badge badge-disabled">已停用</span>' : "";
  const skillsHtml = a.skills.length
    ? a.skills.map(s => {
        const skill = allSkills.find(item => item.name === s);
        return `<span class="skill-tag">${esc(skill?.display_name || s)}</span>`;
      }).join("")
    : '<span class="skill-tag-empty">无 Skill</span>';
  const modelInfo = a.model_profile_id
    ? (() => { const m = modelOptions.find(x=>x.id===a.model_profile_id); return m ? `${esc(m.name)} (${esc(m.model)})` : esc(a.model_profile_id); })()
    : '<span style="color:var(--text-dim)">使用默认配置</span>';
  return `<div class="card${!a.enabled?" disabled":""}">
    <div class="card-header"><div><div class="card-title">${esc(a.name)}${dd}</div><div class="card-id">${esc(a.id)}${a.role?" · "+esc(a.role):""}</div></div></div>
    <div class="card-body">
      <div><span>模型：</span>${modelInfo}</div>
      <div style="margin-top:6px"><span>Skill：</span>${skillsHtml}</div>
      ${a.persona?`<div class="persona-preview">${esc(a.persona)}</div>`:""}
    </div>
    <div class="card-actions">
      <button class="btn btn-ghost btn-sm" onclick="openAgentEditModal('${a.id}')">✏️ 编辑</button>
      <button class="btn btn-danger btn-sm" onclick="deleteAgent('${a.id}')">🗑 删除</button>
    </div>
  </div>`;
}

// Agent modal — Skills (tag input)
let agentSkillTags = [];

function populateSkillSuggestions() {
  const container = $("#skillSuggestions");
  const existing = agentSkillTags.map(t => t.toLowerCase());
  const suggestions = allSkills.filter(s => !existing.includes(s.name.toLowerCase()));
  if (!suggestions.length) { container.innerHTML = ""; return; }
  container.innerHTML = '<span style="font-weight:600">已有 Skill：</span>' +
    suggestions.map(s => `<span style="cursor:pointer;color:var(--accent);margin:0 4px" onclick="addSkillFromSuggestion('${esc(s.name)}')">+${esc(s.display_name || s.name)}</span>`).join("");
}

function addSkillTag(name) {
  name = (name || $("#skillInput").value.trim());
  if (!name) return;
  if (agentSkillTags.includes(name)) { $("#skillInput").value=""; return; }
  agentSkillTags.push(name);
  renderSkillTags();
  $("#skillInput").value = "";
  populateSkillSuggestions();
}
window.addSkillTag = addSkillTag;

function addSkillFromSuggestion(name) {
  if (!agentSkillTags.includes(name)) {
    agentSkillTags.push(name);
    renderSkillTags();
    populateSkillSuggestions();
  }
}
window.addSkillFromSuggestion = addSkillFromSuggestion;

function removeSkillTag(name) {
  agentSkillTags = agentSkillTags.filter(t => t !== name);
  renderSkillTags();
  populateSkillSuggestions();
}
window.removeSkillTag = removeSkillTag;

function renderSkillTags() {
  const container = $("#skillTags");
  container.innerHTML = agentSkillTags.map(t => {
    const skill = allSkills.find(item => item.name === t);
    const label = skill?.display_name || t;
    return (
    `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;background:rgba(108,140,255,.15);color:var(--accent)">
      ${esc(label)}<span style="cursor:pointer;opacity:.7" onclick="removeSkillTag('${esc(t)}')">&times;</span>
    </span>`);
  }).join("");
}

function setAgentSkillTags(skills) {
  agentSkillTags = [...skills];
  renderSkillTags();
  populateSkillSuggestions();
}

function populateModelSelect() {
  const sel = $("#agentFormModel");
  sel.innerHTML = '<option value="">使用默认配置</option>' + modelOptions.map(m =>
    `<option value="${esc(m.id)}">${esc(m.name)} — ${esc(m.provider)} / ${esc(m.model)}</option>`
  ).join("");
}

function getAgentSkills() {
  return [...agentSkillTags];
}

function openAgentAddModal() {
  $("#agentModalTitle").textContent = "新建 Agent";
  $("#agentFormIsEdit").value = "";
  $("#agentFormId").value = ""; $("#agentFormId").disabled = false;
  $("#agentFormName").value = ""; $("#agentFormRole").value = "";
  $("#agentFormPersona").value = ""; $("#agentFormModel").value = "";
  $("#agentFormEnabled").checked = true;
  setAgentSkillTags([]);
  $("#modalAgent").classList.remove("hidden");
}
window.openAgentAddModal = openAgentAddModal;

function openAgentEditModal(id) {
  const a = agents.find(x => x.id === id); if (!a) return;
  $("#agentModalTitle").textContent = `编辑 ${a.id}`;
  $("#agentFormIsEdit").value = a.id;
  $("#agentFormId").value = a.id; $("#agentFormId").disabled = true;
  $("#agentFormName").value = a.name; $("#agentFormRole").value = a.role || "";
  $("#agentFormPersona").value = a.persona || ""; $("#agentFormModel").value = a.model_profile_id || "";
  $("#agentFormEnabled").checked = a.enabled;
  setAgentSkillTags(a.skills || []);
  $("#modalAgent").classList.remove("hidden");
}
window.openAgentEditModal = openAgentEditModal;

function closeAgentModal() { $("#modalAgent").classList.add("hidden"); }
window.closeAgentModal = closeAgentModal;

async function submitAgentForm(e) {
  e.preventDefault();
  const p = {
    id: $("#agentFormId").value.trim(), name: $("#agentFormName").value.trim(),
    role: $("#agentFormRole").value.trim(), persona: $("#agentFormPersona").value.trim(),
    model_profile_id: $("#agentFormModel").value,     skills: getAgentSkills(),
    enabled: $("#agentFormEnabled").checked,
  };
  try {
    const r = await fetch("/api/agents", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(p) });
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail); }
    closeAgentModal(); await loadAgents(); toast(`已保存 ${p.id}`, "success");
  } catch(e) { toast(e.message, "error"); }
}
window.submitAgentForm = submitAgentForm;

async function deleteAgent(id) {
  if (!confirm(`确定删除 Agent "${id}"？`)) return;
  try {
    const r = await fetch(`/api/agents/${id}`, { method:"DELETE" });
    if (!r.ok) { const e = await r.json(); throw new Error(e.detail); }
    await loadAgents(); toast(`已删除 ${id}`, "success");
  } catch(e) { toast(e.message, "error"); }
}
window.deleteAgent = deleteAgent;

$("#modalAgent").addEventListener("click", e => { if (e.target === $("#modalAgent")) closeAgentModal(); });

// ═════════════════════════════════════════════════════════════════════════════
// ============== 权限模式 ==============
// ═════════════════════════════════════════════════════════════════════════════
let wsPermissionMode = localStorage.getItem("wsPermissionMode") || "manual";

function setPermissionMode(mode) {
  wsPermissionMode = mode;
  localStorage.setItem("wsPermissionMode", mode);
  document.getElementById("permManual").classList.toggle("active", mode === "manual");
  document.getElementById("permAuto").classList.toggle("active", mode === "auto");
}
window.setPermissionMode = setPermissionMode;

// 初始化权限按钮状态
setPermissionMode(wsPermissionMode);

// ═════════════════════════════════════════════════════════════════════════════
// ============== 工具确认弹窗 ==============
// ═════════════════════════════════════════════════════════════════════════════
let pendingConfirmId = null;
let pendingThreadId = null;

function toolConfirmRespond(allowed) {
  document.getElementById("modalToolConfirm").classList.add("hidden");
  if (!pendingConfirmId || !pendingThreadId) return;
  fetch(`/api/chat/threads/${pendingThreadId}/tool-response`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ confirm_id: pendingConfirmId, allowed }),
  }).catch(() => {});
  pendingConfirmId = null;
  pendingThreadId = null;
}
window.toolConfirmRespond = toolConfirmRespond;

function showToolConfirm(threadId, confirmId, toolName, toolArgs, dangerous) {
  pendingConfirmId = confirmId;
  pendingThreadId = threadId;
  document.getElementById("toolConfirmTitle").textContent = dangerous
    ? "⚠ 危险操作确认" : "工具调用确认";
  const argsStr = JSON.stringify(toolArgs, null, 2);
  document.getElementById("toolConfirmBody").innerHTML = `
    <div style="margin-bottom:8px"><strong>工具：</strong>${esc(toolName)}</div>
    <div style="background:#11131c;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;font-family:monospace;font-size:.78rem;white-space:pre-wrap;max-height:200px;overflow-y:auto">${esc(argsStr)}</div>
    ${dangerous ? '<div style="margin-top:8px;color:var(--danger);font-weight:600">此命令可能具有破坏性，请仔细检查！</div>' : ""}
  `;
  document.getElementById("modalToolConfirm").classList.remove("hidden");
}

// 点击遮罩关闭
document.getElementById("modalToolConfirm").addEventListener("click", function(e) {
  if (e.target === this) toolConfirmRespond(false);
});

// ── ask_user_question ──────────────────────────────────────────────────────
let pendingAskUserCallId = null;
let pendingAskUserThreadId = null;

function showAskUser(threadId, callId, questions) {
  pendingAskUserCallId = callId;
  pendingAskUserThreadId = threadId;
  document.getElementById("askUserTitle").textContent = "需要您的输入";

  let html = "";
  questions.forEach((q, qi) => {
    const qid = `askuser_q${qi}`;
    html += `<div style="margin-bottom:16px;padding:12px;background:#11131c;border:1px solid var(--border);border-radius:var(--radius-sm)">`;
    html += `<div style="font-weight:700;margin-bottom:8px">${esc(q.header || '问题 ' + (qi+1))}</div>`;
    html += `<div style="color:var(--text-dim);margin-bottom:10px">${esc(q.question)}</div>`;
    const inputType = q.multiSelect ? "checkbox" : "radio";
    (q.options || []).forEach((opt, oi) => {
      const oid = `${qid}_o${oi}`;
      html += `<label style="display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;border-bottom:1px solid var(--border-light, #2a2d3a);font-size:.82rem">`;
      html += `<input type="${inputType}" name="${qid}" value="${esc(opt.label)}" data-q="${qi}" data-label="${esc(opt.label)}">`;
      html += `<div><div>${esc(opt.label)}</div>`;
      if (opt.description) html += `<div style="color:var(--text-dim);font-size:.75rem">${esc(opt.description)}</div>`;
      html += `</div></label>`;
    });
    html += `</div>`;
  });
  document.getElementById("askUserBody").innerHTML = html;
  document.getElementById("modalAskUser").classList.remove("hidden");
}

function askUserRespond(skipAnswers) {
  if (skipAnswers !== null && skipAnswers === null) {
    // 跳过：不发送答案
    fetch(`/api/chat/threads/${pendingAskUserThreadId}/question-response`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ call_id: pendingAskUserCallId, answers: [] }),
    }).catch(() => {});
  } else {
    // 收集所有已选中的选项
    const checked = document.querySelectorAll("#askUserBody input:checked");
    const answersByQ = {};
    checked.forEach(cb => {
      const qIdx = parseInt(cb.dataset.q);
      if (!answersByQ[qIdx]) answersByQ[qIdx] = [];
      answersByQ[qIdx].push(cb.dataset.label || cb.value);
    });
    const answers = Object.entries(answersByQ).map(([qi, labels]) => ({
      questionIndex: parseInt(qi),
      answers: labels,
    }));

    fetch(`/api/chat/threads/${pendingAskUserThreadId}/question-response`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ call_id: pendingAskUserCallId, answers }),
    }).catch(() => {});
  }
  document.getElementById("modalAskUser").classList.add("hidden");
  pendingAskUserCallId = null;
  pendingAskUserThreadId = null;
}

document.getElementById("modalAskUser").addEventListener("click", function(e) {
  if (e.target === this) askUserRespond(null);
});

// ═════════════════════════════════════════════════════════════════════════════
// ============== Skill 市场 ==============
// ═════════════════════════════════════════════════════════════════════════════
let mpHasSearched = false;

async function mpSearch(query) {
  const q = query || document.getElementById("mpSearch").value.trim();
  const source = document.getElementById("mpSource").value || "all";
  const sort = document.getElementById("mpSort").value || "trending";
  mpHasSearched = true;

  const grid = document.getElementById("mpResults");
  const empty = document.getElementById("mpEmpty");
  grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-dim)">搜索中…</div>';
  empty.classList.add("hidden");

  try {
    const params = new URLSearchParams({ q, source, page: "1", sort });
    const res = await fetch(`/api/marketplace/search?${params}`);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const items = data.items || [];

    if (!items.length) {
      grid.innerHTML = "";
      empty.classList.remove("hidden");
      empty.querySelector("p").textContent = `未找到与 "${esc(q)}" 相关的 Skill。`;
      return;
    }

    empty.classList.add("hidden");
    grid.innerHTML = items.map(item => mpCard(item)).join("");
  } catch (e) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--danger)">搜索失败: ${esc(e.message)}</div>`;
  }
}
window.mpSearch = mpSearch;

function mpCard(item) {
  const sourceLabel = item.source === "clawhub" ? "ClawHub" : "SkillsMP";
  const sourceColor = item.source === "clawhub" ? "var(--accent)" : "var(--success)";
  const downloads = item.downloads ? `⭐ ${item.downloads}` : "";
  const githubUrl = encodeURIComponent(item.github_url || "");
  const ownerHandle = encodeURIComponent(item.owner_handle || "");
  const actionBtn = item.installed
    ? '<span style="color:var(--success);font-size:.8rem;font-weight:600">✓ 已安装</span>'
    : `<button class="btn btn-ghost btn-sm" onclick="mpPreview('${esc(item.source)}','${esc(item.slug)}','${githubUrl}','${ownerHandle}')">预览</button>
       <button class="btn btn-primary btn-sm" onclick="mpInstall('${esc(item.source)}','${esc(item.slug)}','${esc(item.name)}','${githubUrl}','${ownerHandle}')">安装</button>`;

  return `<div class="card">
    <div class="card-header">
      <div>
        <div class="card-title">${esc(item.name)}</div>
        <div class="card-id" style="color:${sourceColor};font-weight:600">${sourceLabel} ${downloads}</div>
      </div>
    </div>
    <div class="card-body">
      <p style="line-height:1.5">${esc(item.description || "暂无描述")}</p>
      ${item.author ? `<div style="margin-top:4px;font-size:.75rem">作者: ${esc(item.author)}</div>` : ""}
    </div>
    <div class="card-actions">${actionBtn}</div>
  </div>`;
}

async function mpPreview(source, slug, githubUrl, ownerHandle) {
  try {
    const params = new URLSearchParams();
    if (githubUrl) params.set('url', decodeURIComponent(githubUrl));
    if (ownerHandle) params.set('owner', decodeURIComponent(ownerHandle));
    const qs = params.toString();
    const url = qs
      ? `/api/marketplace/skill/${source}/${slug}?${qs}`
      : `/api/marketplace/skill/${source}/${slug}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error((await res.json()).detail || "获取失败");
    const data = await res.json();
    const preview = data.content || data.description || "无内容";
    // 简单弹窗预览
    const w = window.open("", "_blank", "width=700,height=500");
    if (w) {
      w.document.write(`<pre style="padding:20px;font-family:monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word">${esc(preview)}</pre>`);
    } else {
      alert("预览内容:\n\n" + preview.substring(0, 1000));
    }
  } catch (e) {
    toast("预览失败: " + e.message, "error");
  }
}
window.mpPreview = mpPreview;

async function mpInstall(source, slug, name, githubUrl, ownerHandle) {
  if (!confirm(`确定安装 "${name || slug}"？`)) return;
  try {
    const body = { source, slug };
    if (githubUrl) body.github_url = decodeURIComponent(githubUrl);
    if (ownerHandle) body.owner_handle = decodeURIComponent(ownerHandle);
    const res = await fetch("/api/marketplace/install", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error((await res.json()).detail || "安装失败");
    const data = await res.json();
    toast(`已安装 ${data.name}`, "success");
    // 刷新
    mpSearch(document.getElementById("mpSearch").value.trim());
    loadInstalledSkills();
    loadAgents();
  } catch (e) {
    toast("安装失败: " + e.message, "error");
  }
}
window.mpInstall = mpInstall;

async function loadInstalledSkills() {
  try {
    const res = await fetch("/api/skills");
    if (!res.ok) return;
    const skills = await res.json();
    document.getElementById("mpInstalledCount").textContent = skills.length;

    const list = document.getElementById("mpInstalledList");
    const empty = document.getElementById("mpInstalledEmpty");

    if (!skills.length) {
      list.innerHTML = "";
      empty.style.display = "block";
      return;
    }

    empty.style.display = "none";
    list.innerHTML = skills.map(s => {
      const isProtected = ["review-agent","skill-creator","skill-installer","user-memory"].includes(s.name);
      const c = s.compatibility || {};
      const labels = {green:"完全兼容", yellow:"部分兼容", red:"很难兼容"};
      const statusLabel = c.status === "stale" ? "内容已修改，待重扫" : c.status === "unscanned" ? "尚未扫描" : c.status === "missing" ? "文件缺失" : (labels[c.level] || "待扫描");
      const expanded = localStorage.getItem(`skillExpanded:${s.name}`) === "1";
      const issues = (c.issues || []).map(i => `<div class="compat-issue"><b>${esc(i.message)}</b><br>${esc(i.suggestion || "")}</div>`).join("");
      const badge = isProtected
        ? '<span class="badge" style="background:var(--warning);color:#000;margin-left:6px">系统</span>'
        : '';
      return `<div class="card skill-card ${expanded ? "expanded" : ""}" id="skill-card-${esc(s.name)}">
        <div class="card-header">
          <div>
            <div class="card-title">${esc(s.display_name || s.name)}${badge}</div>
          </div>
          <div class="skill-card-tools">
            <span class="skill-compat ${esc(c.level || "")}">${esc(statusLabel)}</span>
            <button class="skill-icon-btn" title="重新扫描兼容性" onclick="event.stopPropagation();rescanSkillCompatibility('${esc(s.name)}')">↻</button>
            <button class="skill-icon-btn" title="展开或折叠" onclick="event.stopPropagation();toggleInstalledSkill('${esc(s.name)}')">⌄</button>
          </div>
        </div>
        <div class="card-body">
          <p class="skill-description ${expanded ? "" : "collapsed"}" style="line-height:1.5">${esc(s.description || "暂无描述")}</p>
          <div class="skill-details">
            <div><b>扫描结论：</b>${esc(c.summary || "尚未生成兼容报告")}</div>
            ${c.score !== undefined ? `<div><b>兼容分数：</b>${esc(c.score)}/100</div>` : ""}
            <div><b>安全提示：</b>${esc(c.safety_level || "未评估")}</div>
            ${c.scanned_at ? `<div><b>扫描时间：</b>${esc(c.scanned_at)}</div>` : ""}
            ${issues || '<div style="margin-top:6px">未发现具体兼容问题。</div>'}
          </div>
        </div>
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm" onclick="mpPreviewLocal('${esc(s.name)}')">预览</button>
          ${isProtected
            ? '<span style="font-size:.72rem;color:var(--text-dim)">内置保护</span>'
            : `<button class="btn btn-danger btn-sm" onclick="uninstallSkill('${esc(s.name)}')">卸载</button>`}
        </div>
      </div>`;
    }).join("");
  } catch (e) {}
}
window.loadInstalledSkills = loadInstalledSkills;

function toggleInstalledSkill(name) {
  const card = document.getElementById(`skill-card-${name}`);
  if (!card) return;
  card.classList.toggle("expanded");
  localStorage.setItem(`skillExpanded:${name}`, card.classList.contains("expanded") ? "1" : "0");
  const description = card.querySelector(".skill-description");
  if (description) description.classList.toggle("collapsed", !card.classList.contains("expanded"));
}
window.toggleInstalledSkill = toggleInstalledSkill;

async function rescanSkillCompatibility(name) {
  const card = document.getElementById(`skill-card-${name}`);
  const status = card?.querySelector(".skill-compat");
  if (status) status.textContent = "扫描中…";
  try {
    const res = await fetch(`/api/marketplace/skills/${name}/compatibility/scan`, {method:"POST"});
    if (!res.ok) throw new Error((await res.json()).detail || "扫描失败");
    await loadInstalledSkills();
    toast(`已重新扫描 ${name}`, "success");
  } catch (e) { toast("兼容性扫描失败: " + e.message, "error"); }
}
window.rescanSkillCompatibility = rescanSkillCompatibility;

function mpPreviewLocal(name) {
  // 本地 Skill 预览：打开新窗口展示 SKILL.md
  const w = window.open("", "_blank", "width=700,height=500");
  if (w) {
    w.document.write(`<div style="padding:20px;font-family:monospace;font-size:13px;line-height:1.6;color:#e1e4eb;background:#0f1117;height:100%">加载中...</div>`);
    fetch(`/api/marketplace/skill/local/${name}`).then(r => r.json()).then(data => {
      const content = data.content || "无内容";
      w.document.body.innerHTML = `<pre style="padding:20px;font-family:monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:#e1e4eb;background:#0f1117">${esc(content)}</pre>`;
    }).catch(() => {
      w.document.body.innerHTML = '<div style="padding:20px;color:#f44771">加载失败</div>';
    });
  }
}
window.mpPreviewLocal = mpPreviewLocal;

async function uninstallSkill(name) {
  if (!confirm(`确定卸载 "${name}"？\n\n此操作将删除 skills/${name}/ 目录。`)) return;
  try {
    const res = await fetch(`/api/marketplace/skills/${name}`, { method: "DELETE" });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "删除失败");
    }
    toast(`已卸载 ${name}`, "success");
    loadInstalledSkills();
    loadAgents();
    // 刷新搜索结果（更新已安装状态）
    if (mpHasSearched) mpSearch(document.getElementById("mpSearch").value.trim());
  } catch (e) {
    toast("卸载失败: " + e.message, "error");
  }
}
window.uninstallSkill = uninstallSkill;

// ═════════════════════════════════════════════════════════════════════════════
// ============== 工作台 ==============
// ═════════════════════════════════════════════════════════════════════════════
let wsThreads = [];
let wsActiveThreadId = null;
let wsStreaming = false;

let _wsAgents = [];
async function workspaceInit() {
  // 加载 Agent 列表到下拉框
  try {
    const res = await fetch("/api/agents");
    if (!res.ok) return;
    _wsAgents = await res.json();
    const sel = $("#wsAgentSelect");
    // 记住之前的选择：下拉框当前值优先，其次 localStorage 持久化的值
    const prev = sel.value || localStorage.getItem("wsActiveAgentId") || "";
    sel.innerHTML = '<option value="">-- 请选择 --</option>' +
      _wsAgents.filter(a => a.enabled).map(a => `<option value="${esc(a.id)}">${esc(a.name)} (${esc(a.id)})</option>`).join("");
    // 恢复之前的选择（若该 agent 仍启用且在列表中）
    if (prev && _wsAgents.some(a => a.enabled && a.id === prev)) {
      sel.value = prev;
      workspaceOnAgentChange();
    }
  } catch(e) {}
}
window.workspaceInit = workspaceInit;

async function workspaceOnAgentChange() {
  const agentId = $("#wsAgentSelect").value;
  if (!agentId) {
    localStorage.removeItem("wsActiveAgentId");
    $("#wsThreadList").innerHTML = '<div class="ws-empty-threads">请先选择 Agent</div>';
    workspaceShowPlaceholder();
    return;
  }
  localStorage.setItem("wsActiveAgentId", agentId);
  // 加载该 Agent 的线程列表
  try {
    const res = await fetch(`/api/chat/threads?agent_id=${agentId}`);
    wsThreads = await res.json();
    workspaceRenderThreadList();
    // 恢复该 agent 上次打开的线程（若存在且仍属于该 agent）
    const savedThread = localStorage.getItem("wsActiveThreadId");
    if (savedThread && wsThreads.some(t => t.id === savedThread)) {
      workspaceOpenThread(savedThread);
    } else {
      workspaceShowPlaceholder();
    }
  } catch(e) {}
}
window.workspaceOnAgentChange = workspaceOnAgentChange;

function workspaceRenderThreadList() {
  const container = $("#wsThreadList");
  if (!wsThreads.length) {
    container.innerHTML = '<div class="ws-empty-threads">暂无对话，点击上方按钮新建</div>';
    return;
  }
  container.innerHTML = wsThreads.map(t => {
    const activeClass = wsActiveThreadId === t.id ? " active" : "";
    const date = t.updated_at ? t.updated_at.slice(0, 16).replace("T", " ").slice(5) : "";
    return `<div class="ws-thread-item${activeClass}" onclick="workspaceOpenThread('${t.id}')">
      <div class="t-title">${esc(t.title || "新对话")}</div>
      <div class="t-meta">
        <span>${date}</span>
        <span class="t-delete" onclick="event.stopPropagation();workspaceDeleteThread('${t.id}')">🗑</span>
      </div>
    </div>`;
  }).join("");
}

async function workspaceNewThread() {
  const agentId = $("#wsAgentSelect").value;
  if (!agentId) { toast("请先选择 Agent", "error"); return; }
  try {
    const res = await fetch("/api/chat/threads", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({agent_id: agentId, title: ""}),
    });
    if (!res.ok) throw new Error((await res.json()).detail);
    const thread = await res.json();
    wsThreads.unshift(thread);
    workspaceOpenThread(thread.id);
  } catch(e) { toast("创建失败: "+e.message, "error"); }
}
window.workspaceNewThread = workspaceNewThread;

async function workspaceOpenThread(id) {
  wsActiveThreadId = id;
  localStorage.setItem("wsActiveThreadId", id);
  workspaceRenderThreadList();
  workspaceLoadMessages(id);
}
window.workspaceOpenThread = workspaceOpenThread;

async function workspaceDeleteThread(id) {
  if (!confirm("删除此对话？消息也将一并删除。")) return;
  try {
    await fetch(`/api/chat/threads/${id}`, {method:"DELETE"});
    wsThreads = wsThreads.filter(t => t.id !== id);
    if (wsActiveThreadId === id) {
      wsActiveThreadId = null;
      localStorage.removeItem("wsActiveThreadId");
      workspaceShowPlaceholder();
    }
    workspaceRenderThreadList();
  } catch(e) { toast("删除失败", "error"); }
}
window.workspaceDeleteThread = workspaceDeleteThread;

async function workspaceLoadMessages(threadId) {
  try {
    const res = await fetch(`/api/chat/threads/${threadId}`);
    if (!res.ok) throw new Error(await res.text());
    const thread = await res.json();

    $("#wsPlaceholder").style.display = "none";
    $("#wsMessages").style.display = "block";
    $("#wsInputArea").style.display = "flex";

    const msgs = thread.messages || [];
    $("#wsMessages").innerHTML = msgs.length
      ? msgs.map(m => workspaceMsgHTML(m)).join("")
      : "";
    // 滚动到底部
    $("#wsMessages").scrollTop = $("#wsMessages").scrollHeight;
  } catch(e) { toast("加载消息失败: "+e.message, "error"); }
}

function workspaceMsgHTML(m) {
  const label = m.role === "user" ? "用户" : (_wsAgents.find(a => a.id === ($("#wsAgentSelect").value))?.name || "AI");
  return `<div class="ws-msg ${m.role}">
    <div class="ws-msg-label">${label}</div>
    <div class="ws-msg-bubble">${esc(m.content)}</div>
  </div>`;
}

function workspaceShowPlaceholder() {
  $("#wsPlaceholder").style.display = "flex";
  $("#wsMessages").style.display = "none";
  $("#wsMessages").innerHTML = "";
  $("#wsInputArea").style.display = "none";
  wsActiveThreadId = null;
  localStorage.removeItem("wsActiveThreadId");
}

async function workspaceSend() {
  if (wsStreaming) return;
  const content = $("#wsInput").value.trim();
  if (!content) return;
  if (!wsActiveThreadId) { toast("请先选择或新建一个对话", "error"); return; }

  wsStreaming = true;
  $("#wsInput").value = "";
  $("#wsInput").disabled = true;

  // 添加用户消息到界面
  $("#wsMessages").innerHTML += workspaceMsgHTML({role:"user", content});
  $("#wsMessages").scrollTop = $("#wsMessages").scrollHeight;

  // 不在 SSE 返回前创建气泡——等第一个 token 或 tool_call 到了再画
  const aiBubbleId = "ws-" + Date.now();
  const agentName = _wsAgents.find(a => a.id === ($("#wsAgentSelect").value))?.name || "AI";
  let bubbleCreated = false;
  let thinkingShown = false;
  let toolLogCount = 0;

  function ensureBubble() {
    if (bubbleCreated) return;
    bubbleCreated = true;
    // 用 join("") 拼成单行，避免模板字符串换行在 pre-wrap 下被渲染成多余空白
    const html = [
      `<div class="ws-msg assistant" id="${aiBubbleId}">`,
      `<div class="ws-msg-label">${agentName}</div>`,
      `<div class="ws-msg-bubble">`,
      `<div class="ws-text"></div>`,
      `<div class="thinking-slot"></div>`,
      `<div class="tool-log" id="${aiBubbleId}-tool-log" style="display:none">`,
      `<div class="tool-log-header" onclick="toggleToolLog('${aiBubbleId}')">`,
      `<span class="arrow">▸</span>`,
      `<span class="tl-count">已调用 0 个工具/技能</span>`,
      `</div>`,
      `<div class="tool-log-body"></div>`,
      `</div>`,
      `</div>`,
      `</div>`,
    ].join("");
    $("#wsMessages").innerHTML += html;
  }

  function showThinking() {
    ensureBubble();
    if (thinkingShown) return;
    thinkingShown = true;
    const slot = document.querySelector(`#${aiBubbleId} .thinking-slot`);
    slot.innerHTML = `<div class="thinking-msg" id="${aiBubbleId}-thinking"><span>正在思考</span><span class="thinking-spinner"></span></div>`;
    $("#wsMessages").scrollTop = $("#wsMessages").scrollHeight;
  }

  function clearThinking() {
    if (!thinkingShown) return;
    thinkingShown = false;
    const slot = document.querySelector(`#${aiBubbleId} .thinking-slot`);
    if (slot) slot.innerHTML = "";
  }

  // 从工具参数里识别用到的 skill（如 skills/drawio-skill/... 或执行 skill 脚本）
  function extractSkill(args) {
    try {
      const text = JSON.stringify(args || {});
      const m = text.match(/skills[\\/]([a-z0-9_-]+)[\\/]/);
      if (m) return m[1];
      // 也识别以 skill 目录开头的路径参数
      if (args && args.path && /(?:^|[\\/])skills[\\/]/.test(args.path)) {
        const p = args.path.match(/skills[\\/]([a-z0-9_-]+)[\\/]/);
        if (p) return p[1];
      }
    } catch(e) {}
    return null;
  }

  // 从工具参数里提取一行可读摘要
  function extractDetail(args) {
    if (!args) return "";
    if (args.path) return String(args.path);
    if (args.command) return String(args.command).substring(0, 80);
    if (args.pattern) return String(args.pattern);
    if (args.old_string) return String(args.old_string).substring(0, 60);
    try {
      return JSON.stringify(args).substring(0, 80);
    } catch(e) { return ""; }
  }

  function addToolLog(name, args) {
    ensureBubble();
    toolLogCount++;
    const log = document.querySelector(`#${aiBubbleId}-tool-log`);
    const skill = extractSkill(args);
    const detail = extractDetail(args);
    log.style.display = "";
    log.querySelector(".tl-count").textContent = `已调用 ${toolLogCount} 个工具/技能`;
    const item = document.createElement("div");
    item.className = "tool-log-item";
    item.innerHTML = `<span class="tl-name">🔧 ${esc(name)}</span>` +
      (skill ? `<span class="tl-skill">[${esc(skill)}]</span>` : "") +
      (detail ? `<span class="tl-detail">${esc(detail)}</span>` : "");
    log.querySelector(".tool-log-body").appendChild(item);
    $("#wsMessages").scrollTop = $("#wsMessages").scrollHeight;
  }

  function addSkillLog(name, summary) {
    ensureBubble();
    toolLogCount++;
    const log = document.querySelector(`#${aiBubbleId}-tool-log`);
    log.style.display = "";
    log.querySelector(".tl-count").textContent = `已调用 ${toolLogCount} 个工具/技能`;
    const item = document.createElement("div");
    item.className = "tool-log-item";
    item.innerHTML = `<span class="tl-name" style="color:var(--accent)">🧠 ${esc(name)}</span>` +
      (summary ? `<span class="tl-detail">${esc(summary)}</span>` : "");
    log.querySelector(".tool-log-body").appendChild(item);
    $("#wsMessages").scrollTop = $("#wsMessages").scrollHeight;
  }

  // 发送后立即显示"正在思考"，直到第一个 token / 工具调用到来
  showThinking();

  try {
    const res = await fetch(`/api/chat/threads/${wsActiveThreadId}/messages`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Permission-Mode": wsPermissionMode,
      },
      body: JSON.stringify({ content, permission_mode: wsPermissionMode }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "请求失败");
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        try {
          const data = JSON.parse(line.slice(6));

          if (data.event === "tool_call") {
            clearThinking();
            const d = data.data;
            addToolLog(d.name, d.args);
          }
          else if (data.event === "skill") {
            const d = data.data;
            addSkillLog(d.name, d.summary || d.action || "");
          }
          else if (data.event === "tool_result") {
            // 工具已执行完毕，回到"思考"状态等待下一步输出
            showThinking();
          }
          else if (data.event === "ask_user") {
            const d = data.data;
            showAskUser(wsActiveThreadId, d.call_id, d.questions || []);
          }
          else if (data.event === "tool_confirm") {
            const d = data.data;
            // 显示确认弹窗
            showToolConfirm(wsActiveThreadId, d.confirm_id, d.name, d.args, d.dangerous);
          }
          else if (data.token) {
            clearThinking();
            ensureBubble();
            const text = document.querySelector(`#${aiBubbleId} .ws-text`);
            text.innerHTML += esc(data.token);
            $("#wsMessages").scrollTop = $("#wsMessages").scrollHeight;
          }
          else if (data.done) {
            clearThinking();
          }
          else if (data.error) {
            clearThinking();
            ensureBubble();
            const text = document.querySelector(`#${aiBubbleId} .ws-text`);
            text.innerHTML += `<br/>[错误: ${esc(data.error)}]`;
          }
        } catch(e) {}
      }
    }
  } catch(e) {
    clearThinking();
    ensureBubble();
    document.querySelector(`#${aiBubbleId} .ws-text`).textContent = `请求失败: ${esc(e.message)}`;
  }

  wsStreaming = false;
  $("#wsInput").disabled = false;
  $("#wsInput").focus();

  // 刷新线程列表（更新标题和时间）
  workspaceOnAgentChange();
}
window.workspaceSend = workspaceSend;

// 展开 / 收起工具调用折叠栏（供气泡内 onclick 调用）
function toggleToolLog(bubbleId) {
  const log = document.querySelector(`#${bubbleId}-tool-log`);
  if (log) log.classList.toggle("open");
}
window.toggleToolLog = toggleToolLog;

// ═════════════════════════════════════════════════════════════════════════════
// 初始化
// ═════════════════════════════════════════════════════════════════════════════
loadProfiles();
loadAgents();
</script>
